name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage binary
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/syscall_loader.exe dist/syscall_loader.exe
      - uses: actions/upload-artifact@v7
        with:
          name: syscall_loader
          path: dist/syscall_loader.exe
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: syscall_loader
          path: dist
      - name: Create checksum
        run: (cd dist && sha256sum syscall_loader.exe > syscall_loader.exe.sha256)
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$TAG" dist/syscall_loader.exe dist/syscall_loader.exe.sha256 \
            --generate-notes --verify-tag "${prerelease[@]}"
